    string error_message = 3;
}

message GetResearcherRequest {
    int32 id = 1;
}

message GetResearcherResponse {
    Researcher researcher = 1;
    string error_message = 2;
    bool success = 3; // Indicates if the retrieval was successful
}

message GetResearcherByUserIdRequest {
    int32 user_id = 1;
}

message GetResearcherByUserIdResponse {
    Researcher researcher = 1;
    string error_message = 2;
    bool success = 3; // Indicates if the retrieval was successful
}

message UpdateResearcherRequest {
    int32 id = 1;
    optional string wilaya = 2;
    optional FileData profile_picture = 3;      // Optional new profile picture
    optional FileData secondary_profile_picture = 4;  // Optional new secondary profile picture
}

message UpdateResearcherResponse {
    bool success = 1;
    Researcher researcher = 2;                 // Includes updated image paths
    string error_message = 3;
}

message DeleteResearcherRequest {
    int32 id = 1;
}

message DeleteResearcherResponse {
    bool success = 1;
    string error_message = 2;
}

message ListResearchersRequest {
    int32 page_size = 1;
    int32 page_number = 2;
}

message ListResearchersResponse {
    repeated Researcher researchers = 1;
    int32 total_count = 2;
    string error_message = 3;
    bool success = 4; // Indicates if the retrieval was successful
}

//------------------------------------------------------------------------------
// Student Profile Service
//------------------------------------------------------------------------------

// Service for managing extended student profile information
service StudentProfileService {
    // Creates a new student profile
    rpc CreateStudentProfile(CreateStudentProfileRequest) returns (CreateStudentProfileResponse) {}
    
    // Retrieves student profile by ID
    rpc GetStudentProfile(GetStudentProfileRequest) returns (GetStudentProfileResponse) {}
    
    // Updates existing student profile
    rpc UpdateStudentProfile(UpdateStudentProfileRequest) returns (UpdateStudentProfileResponse) {}
    
    // Deletes a student profile
    rpc DeleteStudentProfile(DeleteStudentProfileRequest) returns (DeleteStudentProfileResponse) {}
}

message CreateStudentProfileRequest {
    int32 student_id = 1;
    google.protobuf.Struct profile_data = 2;
}

message CreateStudentProfileResponse {
    bool success = 1;
    StudentProfile profile = 2;
    string error_message = 3;
}

message GetStudentProfileRequest {
    int32 id = 1;
}

message GetStudentProfileResponse {
    StudentProfile profile = 1;
    string error_message = 2;
    bool success = 3; // Indicates if the retrieval was successful
}

message UpdateStudentProfileRequest {
    StudentProfile profile = 1;
}

message UpdateStudentProfileResponse {
    bool success = 1;
    string error_message = 2;
}

message DeleteStudentProfileRequest {
    int32 id = 1;
}

message DeleteStudentProfileResponse {
    bool success = 1;
    string error_message = 2;
}
